<svg xmlns="http://www.w3.org/2000/svg" width="214" height="52" viewBox="0 0 214 52" role="img" aria-label="Get in touch">
<title>Get in touch</title>
<style>
.serif{font-family:'Iowan Old Style','Charter','Georgia','Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.eyebrow{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:2.6px}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>

<rect x="0" y="0" width="214" height="52" rx="26" fill="#141414"/>
<text x="26" y="31.5" class="sans" font-size="15" font-weight="600" fill="#FFFFFF">Get in touch</text>
<circle cx="187" cy="26" r="17" fill="#FFFFFF"/>
<path d="M181 32 L193 20 M184 20 L193 20 L193 29" stroke="#141414" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
