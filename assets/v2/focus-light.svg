<svg xmlns="http://www.w3.org/2000/svg" width="830" height="268" viewBox="0 0 830 268" role="img" aria-label="Focus areas">
<title>Focus areas</title>
<style>
.serif{font-family:'Iowan Old Style','Charter','Georgia','Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.eyebrow{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:2.6px}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>

<g class="rise" style="animation-delay:0.05s">
  <rect x="0.5" y="0.5" width="451" height="267" rx="20" fill="#FFFFFF" stroke="rgba(20,20,20,0.08)"/>
  <rect x="24" y="24" width="34" height="22" rx="11" fill="#141414"/>
  <text x="41" y="39.5" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#FFFFFF">01</text>
  <text x="24" y="96" class="serif" font-size="30" font-weight="700" fill="#141414" letter-spacing="-.3">Interface design</text>
  <text x="24" y="128" class="sans" font-size="15" fill="#4A4A46">Clean layouts, considered type, and</text><text x="24" y="150" class="sans" font-size="15" fill="#4A4A46">motion that feels quiet and deliberate —</text><text x="24" y="172" class="sans" font-size="15" fill="#4A4A46">from the first sketch to the shipped pixel.</text>
  <rect x="24" y="218" width="70" height="28" rx="14" fill="#F3F2EE"/><text x="59" y="236.5" text-anchor="middle" class="sans" font-size="12.5" fill="#4A4A46">Layout</text><rect x="102.4" y="218" width="100" height="28" rx="14" fill="#F3F2EE"/><text x="152" y="236.5" text-anchor="middle" class="sans" font-size="12.5" fill="#4A4A46">Typography</text><rect x="210.4" y="218" width="70" height="28" rx="14" fill="#F3F2EE"/><text x="246" y="236.5" text-anchor="middle" class="sans" font-size="12.5" fill="#4A4A46">Motion</text><rect x="288.8" y="218" width="107" height="28" rx="14" fill="#F3F2EE"/><text x="342" y="236.5" text-anchor="middle" class="sans" font-size="12.5" fill="#4A4A46">Prototyping</text>
</g>
<g class="rise" style="animation-delay:0.18s">
  <rect x="466.5" y="0.5" width="363" height="126.0" rx="20" fill="#FFFFFF" stroke="rgba(20,20,20,0.08)"/>
  <rect x="490" y="24" width="34" height="22" rx="11" fill="#F3F2EE"/>
  <text x="507" y="39.5" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#7A7871">02</text>
  <text x="490" y="80" class="serif" font-size="21" font-weight="700" fill="#141414" letter-spacing="-.3">Front-end engineering</text>
  <text x="490" y="104" class="sans" font-size="14" fill="#4A4A46">Semantic HTML, modern CSS, JS / TS &amp; React.</text>
  
</g>
<g class="rise" style="animation-delay:0.3s">
  <rect x="466.5" y="141.5" width="363" height="126.0" rx="20" fill="#FFFFFF" stroke="rgba(20,20,20,0.08)"/>
  <rect x="490" y="165.0" width="34" height="22" rx="11" fill="#F3F2EE"/>
  <text x="507" y="180.5" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#7A7871">03</text>
  <text x="490" y="221.0" class="serif" font-size="21" font-weight="700" fill="#141414" letter-spacing="-.3">Engineering depth</text>
  <text x="490" y="245.0" class="sans" font-size="14" fill="#4A4A46">C / C++, graphics, ML and systems groundwork.</text>
  
</g>
</svg>
