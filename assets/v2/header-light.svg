<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-label="Seung Hun Lee — UI/UX Designer &amp; Front-end Developer">
<title>Seung Hun Lee — UI/UX Designer &amp; Front-end Developer</title>
<style>
.serif{font-family:'Iowan Old Style','Charter','Georgia','Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.eyebrow{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:2.6px}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
.frame{stroke-dasharray:1224;stroke-dashoffset:1224;animation:draw 1.1s cubic-bezier(.6,0,.2,1) .45s forwards}@keyframes draw{to{stroke-dashoffset:0}}.handle{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.4) forwards}@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}.caret{animation:blink 1.1s steps(1) 2s infinite;opacity:0}@keyframes blink{0%{opacity:1}50%{opacity:0}}.dim{opacity:0;animation:fadein .6s ease 1.5s forwards}@keyframes fadein{to{opacity:1}}</style>

<rect x="0.5" y="0.5" width="829" height="299" rx="28" fill="#FAFAF8" stroke="rgba(20,20,20,0.08)"/>

<g class="rise" style="animation-delay:0.05s">
  <circle cx="56" cy="58" r="3.5" fill="#141414"/>
  <text x="68" y="62" class="eyebrow" fill="#7A7871">SEUNGHUNIZM</text>
</g>
<text x="778" y="62" text-anchor="end" class="eyebrow rise" style="animation-delay:0.1s" fill="#B8B6AE">UI / UX · FRONT-END</text>

<rect class="frame" x="52" y="96" width="516" height="96" fill="none" stroke="rgba(20,20,20,0.18)" stroke-width="1"/>
<rect class="handle" x="48" y="92" width="8" height="8" fill="#FFFFFF" stroke="#141414" stroke-width="1.2" style="animation-delay:1.25s"/><rect class="handle" x="564" y="92" width="8" height="8" fill="#FFFFFF" stroke="#141414" stroke-width="1.2" style="animation-delay:1.31s"/><rect class="handle" x="564" y="188" width="8" height="8" fill="#FFFFFF" stroke="#141414" stroke-width="1.2" style="animation-delay:1.37s"/><rect class="handle" x="48" y="188" width="8" height="8" fill="#FFFFFF" stroke="#141414" stroke-width="1.2" style="animation-delay:1.43s"/>
<g class="dim">
  <rect x="52" y="70" width="66" height="18" rx="4" fill="#141414"/>
  <text x="85" y="83" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#FFFFFF">516 × 96</text>
</g>
<text x="70" y="164" class="serif rise" style="animation-delay:0.15s" font-size="62" font-weight="700" fill="#141414" letter-spacing="-1.2">Seung Hun Lee</text>

<text x="54" y="240" class="sans rise" style="animation-delay:0.3s" font-size="21" fill="#4A4A46">UI/UX Designer <tspan fill="#B8B6AE">&amp;</tspan> Front-end Developer</text>
<rect class="caret" x="424" y="222" width="2" height="23" fill="#141414"/>

</svg>
